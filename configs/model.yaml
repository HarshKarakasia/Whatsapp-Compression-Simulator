# Model architecture (Phase 5). Loss weights live here too once Phase 6
# adds them -- not yet, to avoid guessing values before they're needed.

# Router/expert count. The full design targets K=13 (one cluster per
# codec x depth combination + clean), documented as the intended target,
# but at this project's dataset scale (~80-120 source videos for the
# micro-run) spreading samples over 13 clusters starves the router's
# load-balancing loss. Reduced to 5 for anything actually trained here --
# see BUILD.md Appendix A. Change this, not the code, if the real dataset
# budget ends up larger.
num_experts: 5
top_k: 2

# L_route's cross-entropy target: router_target string (from Phase 2's
# probe.py, e.g. "h264_G1") -> cluster index in [0, num_experts).
# Matches Appendix A's reduced scheme exactly: clean + 2 codecs x 2 depths
# = 5 clusters. Any router_target not listed here (h264_G3, h265_G3, any
# vp9/av1 target) falls back to `default` -- a real training run at this
# scale should only use data whose router_target is explicitly listed,
# since the fallback exists for L_route's loss math to stay well-defined,
# not as a real cluster assignment.
router_clusters:
  clean_G0: 0
  h264_G1: 1
  h264_G2: 2
  h265_G1: 3
  h265_G2: 4
  default: 0

loss_weights:
  cls: 1.0
  route: 0.5
  con: 0.3
  bal: 0.1

contrastive:
  temperature: 0.07

spatial:
  # ViT-B/14 standard dims, matching real DINOv2 (vit_base_patch14_dinov2)
  # exactly so pretrained=True's weight remap (SpatialBranch.
  # load_pretrained_dinov2) lines up. layer_norm_eps=1e-6 is DINOv2's
  # actual value (confirmed against the real model, not PyTorch's
  # LayerNorm default of 1e-5) -- without it the frozen backbone's
  # forward pass silently diverges from the real pretrained model by a
  # small amount per layer that compounds across 12 layers into a large
  # difference. Found and fixed during the first real pretrained-load.
  embed_dim: 768
  patch_size: 14
  img_size: 224
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
  layer_norm_eps: 1.0e-6
  lora_rank: 8
  lora_alpha: 8
  lora_targets: [q_proj, v_proj]

frequency:
  embed_dim: 768
  depth: 4
  num_heads: 8
  mlp_ratio: 4.0
  dct_coeffs: 64
  n_tokens: 784

fusion:
  embed_dim: 768
  num_heads: 8

router:
  hidden_dim: 256

experts:
  hidden_dim: 256
